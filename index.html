<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Игра - Собери кубики</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#111;color:#fff}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:12px;border-radius:10px}
#score{font-size:22px;font-weight:bold;color:yellow}
button{padding:8px 14px;border:0;border-radius:8px;background:#00c853;color:#fff;cursor:pointer;margin-top:8px}
#msg{position:absolute;top:40%;width:100%;text-align:center;font-size:40px;display:none}
#help{font-size:13px;opacity:.8}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="ui">
<div id="score">Очки: 0 / 10</div>
<div>Время: <span id="time">60</span></div>
<div id="help">WASD - движение, Пробел - прыжок, мышка - осмотр (клик)</div>
<button onclick="location.reload()">Заново</button>
</div>
<div id="msg">ПОБЕДА!</div>
<script>
let scene,camera,renderer,player,coins=[],enemies=[];
let score=0,total=10,timeLeft=60,over=false,keys={},velY=0,onG=true,yaw=0,pitch=0;
function init(){
scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,20,90);
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer({antialias:true});renderer.shadowMap.enabled=true;
renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
let sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(20,30,10);sun.castShadow=true;scene.add(sun);
let g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x3cb043}));
g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
let wm=new THREE.MeshLambertMaterial({color:0x555555});
[[0,-30,60,1],[0,30,60,1],[-30,0,1,60],[30,0,1,60]].forEach(a=>{
let m=new THREE.Mesh(new THREE.BoxGeometry(a[2],3,a[3]),wm);m.position.set(a[0],1.5,a[1]);scene.add(m);});
player=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0x0055ff}));
player.position.set(0,0.5,0);player.castShadow=true;scene.add(player);
for(let i=0;i<total;i++)spawnCoin();
for(let i=0;i<3;i++){
let e=new THREE.Mesh(new THREE.SphereGeometry(0.7,16,16),new THREE.MeshLambertMaterial({color:0xff0000}));
e.position.set((Math.random()-0.5)*40,0.7,(Math.random()-0.5)*40);e.castShadow=true;scene.add(e);
enemies.push({mesh:e,speed:2+Math.random()*2,ang:Math.random()*6.28});}
for(let i=0;i<15;i++){
let t=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,3),new THREE.MeshLambertMaterial({color:0x5a3a1a}));
t.position.set((Math.random()-0.5)*50,1.5,(Math.random()-0.5)*50);scene.add(t);
let l=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),new THREE.MeshLambertMaterial({color:0x0a7a0a}));
l.position.copy(t.position);l.position.y=3.5;scene.add(l);}
document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*0.0025;pitch-=e.movementY*0.0025;
pitch=Math.max(-1.2,Math.min(1.2,pitch));}});
renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
setInterval(()=>{if(!over){timeLeft--;document.getElementById('time').textContent=timeLeft;
if(timeLeft<=0)endGame(false);}},1000);
animate();}
function spawnCoin(){
let c=new THREE.Mesh(new THREE.OctahedronGeometry(0.5),new THREE.MeshLambertMaterial({color:0xffd700}));
c.position.set((Math.random()-0.5)*44,1,(Math.random()-0.5)*44);c.castShadow=true;scene.add(c);coins.push(c);}
function endGame(win){over=true;let m=document.getElementById('msg');m.style.display='block';
m.textContent=win?'ТЫ ВЫИГРАЛ! 🎉':'ВРЕМЯ ВЫШЛО! Очки: '+score;}
function animate(){requestAnimationFrame(animate);if(over)return;
let sp=0.15,fx=-Math.sin(yaw),fz=-Math.cos(yaw);
if(keys['KeyW']||keys['ArrowUp']){player.position.x+=fx*sp;player.position.z+=fz*sp;}
if(keys['KeyS']||keys['ArrowDown']){player.position.x-=fx*sp;player.position.z-=fz*sp;}
if(keys['KeyA']||keys['ArrowLeft']){player.position.x+=fz*sp;player.position.z-=fx*sp;}
if(keys['KeyD']||keys['ArrowRight']){player.position.x-=fz*sp;player.position.z+=fx*sp;}
player.position.x=Math.max(-28,Math.min(28,player.position.x));
player.position.z=Math.max(-28,Math.min(28,player.position.z));
if(keys['Space']&&onG){velY=0.25;onG=false;}
player.position.y+=velY;velY-=0.012;
if(player.position.y<=0.5){player.position.y=0.5;velY=0;onG=true;}
camera.position.set(player.position.x+Math.sin(yaw)*6,player.position.y+3+Math.sin(pitch)*6,player.position.z+Math.cos(yaw)*6);
camera.lookAt(player.position.x,player.position.y+1,player.position.z);
for(let i=coins.length-1;i>=0;i--){coins[i].rotation.y+=0.05;
if(coins[i].position.distanceTo(player.position)<1.3){scene.remove(coins[i]);coins.splice(i,1);score++;
document.getElementById('score').textContent='Очки: '+score+' / '+total;
if(score>=total)endGame(true);else spawnCoin();}}
enemies.forEach(o=>{o.ang+=0.01*o.speed;
o.mesh.position.x+=Math.sin(o.ang)*0.05*o.speed;o.mesh.position.z+=Math.cos(o.ang)*0.05*o.speed;
if(o.mesh.position.distanceTo(player.position)<1.2){
player.position.x+=(player.position.x-o.mesh.position.x)*0.5;
player.position.z+=(player.position.z-o.mesh.position.z)*0.5;
score=Math.max(0,score-1);
document.getElementById('score').textContent='Очки: '+score+' / '+total;}});
renderer.render(scene,camera);}
init();
</script>
</body>
</html>
